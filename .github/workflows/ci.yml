name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install GTK development libraries
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets --all-features
      - run: cargo build --locked --release

  protocol:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: protocol
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Download and verify pinned protocol sources
        working-directory: .
        run: python3 scripts/vendor-protocol.py --ensure
      - name: Test dependency preparation
        working-directory: .
        run: python3 -m unittest discover -s scripts/tests -p '*_test.py'
      - name: Install image conversion tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: deno task check
      - name: Compile offline sidecar
        working-directory: .
        run: DENO_OFFLINE=1 ./scripts/build-sidecar.sh
      - name: Verify compiled sidecar with an empty session and cache
        working-directory: .
        run: |
          python3 scripts/check-sidecar.py protocol/line-gtk-protocol

  package:
    runs-on: ubuntu-24.04
    needs: [rust, protocol]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: Swatinem/rust-cache@v2
      - name: Install runtime and build libraries
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev ffmpeg
      - run: ./packaging/make-prebuild.sh

  aur-package:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
      - name: Install Arch build dependencies
        run: pacman -Syu --noconfirm --needed rust deno git python gtk4 libadwaita ffmpeg
      - name: Build the current checkout through makepkg
        run: |
          useradd --create-home builder
          mkdir -p /tmp/line-gtk-aur/src
          cp packaging/aur/line-gtk-git/PKGBUILD /tmp/line-gtk-aur/
          cp -a "$GITHUB_WORKSPACE" /tmp/line-gtk-aur/src/Line-GTK
          chown -R builder:builder /tmp/line-gtk-aur
          runuser -u builder -- bash -c '
            set -e
            cd /tmp/line-gtk-aur/src/Line-GTK
            cargo fetch --locked
            cd /tmp/line-gtk-aur
            makepkg --noextract --noprepare --holdver --noconfirm
          '
      - name: Test the final Arch package after makepkg post-processing
        run: ./packaging/check-package.sh /tmp/line-gtk-aur/*.pkg.tar.zst

  flatpak:
    runs-on: ubuntu-24.04
    needs: [rust, protocol]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: Swatinem/rust-cache@v2
      - name: Install Flatpak build tools
        run: sudo apt-get update && sudo apt-get install -y appstream flatpak flatpak-builder libgtk-4-dev libadwaita-1-dev ffmpeg
      - name: Add Flathub
        run: flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
      - name: Validate application metadata
        run: appstreamcli validate --no-net packaging/flatpak/dev.linegtk.LineGtk.metainfo.xml
      - name: Build and smoke-test Flatpak bundle
        run: ./packaging/make-flatpak.sh
